name: Checks

# Runs the workspace test suite on every pull request.
#
# This repo is a PUBLIC fork of marius851000/blades-server-rewritten, so pull
# requests can come from anyone. That is fine and deliberate — this workflow
# holds no secrets and needs none. GitHub does not expose secrets to workflows
# triggered by a fork PR anyway, and there are none here to expose.
#
# The deploy half lives in release.yml, which runs only on push to main (i.e.
# after a human has merged) and publishes to this repo's own package registry.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # deploy/*.sh is not covered by `cargo test`, and it is the half of this repo
  # that talks to production. A broken deploy script does not fail here, it
  # fails at the moment someone is trying to ship. Seconds to run, so there is
  # no reason for it to stay a manual step nobody remembers.
  shell:
    name: deploy scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: shell syntax
        run: |
          set -euo pipefail
          fail=0
          for f in deploy/*.sh; do
            [ -e "$f" ] || continue
            bash -n "$f" || { echo "::error file=$f::bash -n failed"; fail=1; }
          done
          exit $fail

      # rsync and ssh are mocked, so this reaches no host and needs no secrets.
      # test-migrate-ledger.sh is deliberately not run alongside it: that one
      # reconstructs the migrate entrypoint out of the compose file and is about
      # the database, not about whether a deploy script is safe to run.
      - name: arena.sh static
        run: deploy/test-arena-static.sh

  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The device-claim guards (server/src/admin.rs) are a SQL `WHERE` clause and
    # a rows-affected count. Nothing in Rust can check those, and a test that
    # re-implemented the rule in Rust would pass happily with the guard deleted
    # from the statement the server actually sends. So those tests run the real
    # statements against a real Postgres — and CI has to provide one, or they
    # skip and the guard goes unverified.
    #
    # 16-alpine matches docker-compose.arena.yml, i.e. production. `ON CONFLICT
    # … DO UPDATE … WHERE` is the load-bearing syntax here, so proving it on a
    # different major would not prove much.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blades
          POSTGRES_PASSWORD: blades
          POSTGRES_DB: blades_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blades -d blades_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # zstd-sys needs a C toolchain; ubuntu-latest has one, but pkg-config is
      # what the Dockerfile installs explicitly, so match it.
      - name: build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config

      # 292 locked crates. Without a cache every run is a cold build and the
      # gate becomes something people want to skip.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: cargo test
        env:
          TEST_DATABASE_URL: postgres://blades:blades@127.0.0.1:5432/blades_test
        run: cargo test --workspace --locked

      # A skipped security test looks exactly like a passing one in the summary
      # line. This fails the job if the DB tests did not actually run, so the
      # guard cannot quietly stop being checked.
      # Same reasoning as the device-claim guard below: these tests are the
      # only thing standing between an import and a character nobody can get
      # back, and a skip reads as a pass.
      - name: the character-versioning tests really ran
        env:
          TEST_DATABASE_URL: postgres://blades:blades@127.0.0.1:5432/blades_test
        run: |
          set -euo pipefail
          out=$(cargo test --locked -p server character_versions -- --nocapture 2>&1)
          echo "$out"
          if grep -q 'TEST_DATABASE_URL unset' <<<"$out"; then
            echo "::error::character-versioning tests skipped — snapshots were NOT verified"
            exit 1
          fi
          # A floor, not an exact count — see the note on the guard below.
          n=$(grep -oE 'test result: ok\. [0-9]+ passed' <<<"$out" | grep -oE '[0-9]+' | tail -1)
          if [ -z "$n" ] || [ "$n" -lt 16 ]; then
            echo "::error::expected at least 16 character-versioning tests, saw ${n:-none}"
            exit 1
          fi

      - name: the device-claim guards really ran
        env:
          TEST_DATABASE_URL: postgres://blades:blades@127.0.0.1:5432/blades_test
        run: |
          set -euo pipefail
          out=$(cargo test --locked -p server device_claims -- --nocapture 2>&1)
          echo "$out"
          if grep -q 'TEST_DATABASE_URL unset' <<<"$out"; then
            echo "::error::device-claim tests skipped — the guard was NOT verified"
            exit 1
          fi
          # A MINIMUM, not an exact count. The point of this guard is to catch
          # the tests silently not running (a skip, a filter typo, a harness
          # change) -- and a count that only ever drops catches that just as
          # well. Pinning it exactly meant every legitimately-added test failed
          # CI until someone bumped the number, which trains people to edit the
          # guard rather than read it. Raise the floor when you add coverage you
          # want protected.
          n=$(grep -oE 'test result: ok\. [0-9]+ passed' <<<"$out" | grep -oE '[0-9]+' | tail -1)
          if [ -z "$n" ] || [ "$n" -lt 16 ]; then
            echo "::error::expected at least 16 device-claim tests to run and pass, saw '${n:-none}'"
            exit 1
          fi
          echo "device-claim guards verified: $n tests passed"

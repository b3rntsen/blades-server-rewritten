# Newblades arena game server + its Postgres, sized for a SMALL, shared box:
# both are strictly memory-capped (mem_limit) so they are cgroup-isolated and
# CANNOT starve a co-located prod stack (e.g. twitter-bookmarks). 2 GB swap on
# the host is the backstop. NOT auto-deployed — see deploy/README-arena-deploy.md.
#
# Build the image OFF the 1.9 GB box (it OOMs a release build); this box only runs it.
services:
  arena-db:
    image: postgres:16-alpine
    container_name: arena-db
    restart: always
    environment:
      POSTGRES_USER: blades
      POSTGRES_PASSWORD: ${ARENA_DB_PASSWORD:?set ARENA_DB_PASSWORD in arena.env}
      POSTGRES_DB: blades
    # Tuned tiny so it fits the 256m cap on a constrained box.
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=20
      -c effective_cache_size=96MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_wal_size=256MB
    volumes:
      - arena-db-data:/var/lib/postgresql/data
    mem_limit: 256m
    networks: [arena_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blades -d blades"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply the diesel migrations' up.sql on a FRESH db (idempotent — it
  # skips if the `users` table already exists), so the server finds its tables.
  arena-migrate:
    image: postgres:16-alpine
    depends_on:
      arena-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${ARENA_DB_PASSWORD:?set ARENA_DB_PASSWORD in arena.env}
    volumes:
      - ./migrations:/migrations:ro
    networks: [arena_net]
    # A real ledger, replacing "skip everything if the users table exists".
    #
    # The old rule meant this container did nothing on every deployment after
    # the first — while still exiting 0, which arena-server treats via
    # `service_completed_successfully` as "the schema is ready". So a new binary
    # could start against a schema that lacked its columns, and the only thing
    # standing between us and that was remembering to hand-apply ALTERs on the
    # box. The newest migration's own header says exactly that:
    #
    #     NOTE FOR DEPLOY: the migrate one-shot skips everything once 'users'
    #     exists, so this must be applied BY HAND on the box before the new
    #     binary ships.
    #
    # A deploy step that lives in a comment is not a deploy step. Now: apply
    # what has not been applied, record it, and FAIL if anything errors so the
    # dependency gate actually gates.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        PSQL="psql -h arena-db -U blades -d blades -v ON_ERROR_STOP=1 -tA"
        $$PSQL -c "CREATE TABLE IF NOT EXISTS schema_migrations (
                     version    text PRIMARY KEY,
                     applied_at timestamptz NOT NULL DEFAULT now())"

        # ADOPTION. The live database predates this ledger and already has all
        # 16 migrations applied by hand, so an empty ledger must NOT be read as
        # "apply everything" — that would re-run 16 non-idempotent scripts
        # against production. Empty ledger + existing users table means an
        # established database: record the current migrations as applied and
        # change nothing. A genuinely fresh database has no users table and
        # falls through to the normal path below.
        if [ "$$($$PSQL -c 'SELECT count(*) FROM schema_migrations')" = "0" ] \
           && [ -n "$$($$PSQL -c "SELECT to_regclass('public.users')")" ]; then
          echo "[arena-migrate] established schema, empty ledger -> adopting, applying nothing"
          for d in $$(ls -d /migrations/*/ | sort); do
            v=$$(basename "$$d")
            $$PSQL -c "INSERT INTO schema_migrations(version) VALUES ('$$v') ON CONFLICT DO NOTHING"
            echo "  adopted $$v"
          done
          exit 0
        fi

        n=0
        for d in $$(ls -d /migrations/*/ | sort); do
          v=$$(basename "$$d")
          [ -f "$$d/up.sql" ] || continue
          if [ -n "$$($$PSQL -c "SELECT 1 FROM schema_migrations WHERE version = '$$v'")" ]; then
            continue
          fi
          echo "[arena-migrate] applying $$v"
          psql -h arena-db -U blades -d blades -v ON_ERROR_STOP=1 -f "$$d/up.sql"
          $$PSQL -c "INSERT INTO schema_migrations(version) VALUES ('$$v')"
          n=$$((n + 1))
        done
        echo "[arena-migrate] done ($$n newly applied)"
    restart: "no"

  arena-server:
    # Published by .github/workflows/release.yml on merge to main. Production
    # PULLS this; it does not build. The box is 2 vCPU / 1.9 GB and the release
    # build OOMs there, and a forgotten --no-cache silently ships a stale binary
    # — both problems disappear when the artifact is built once, elsewhere, from
    # a clean checkout.
    #
    # ARENA_IMAGE_TAG exists for rollback: set it to a previous sha-<short> tag
    # and `up -d` to go back. Defaults to the tag the box tracks.
    image: ghcr.io/b3rntsen/blades-arena-server:${ARENA_IMAGE_TAG:-main}
    # Kept for local development only — `docker compose build arena-server`.
    # Production never reaches it: the deploy helper runs `up -d --no-build`.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena-server
    restart: always
    depends_on:
      arena-migrate:
        condition: service_completed_successfully
    environment:
      ARENA_IMPORT_TOKEN: ${ARENA_IMPORT_TOKEN:?set ARENA_IMPORT_TOKEN in arena.env}
      ARENA_ADVERTISE_HOST: ${ARENA_ADVERTISE_HOST:-127.0.0.1}
      ARENA_UDP_PORT: ${ARENA_UDP_PORT:-7777}
      ARENA_MAX_MATCHES: ${ARENA_MAX_MATCHES:-16}
      # Seconds a lone matchmaking ticket waits for a human opponent before falling
      # back to a solo match vs a bot. Tunable without a rebuild (recreate to apply).
      ARENA_SOLO_FALLBACK_SECS: ${ARENA_SOLO_FALLBACK_SECS:-20}
      ARENA_BOT_USER_IDS: ${ARENA_BOT_USER_IDS:-}
      # Dev override: pin EVERY anon login to this user (a Transfer'd character),
      # since there's no Bethesda/Google identity. Empty/unset = normal behaviour.
      ARENA_DEV_LOGIN_USER_ID: ${ARENA_DEV_LOGIN_USER_ID:-}
      # Per-match key submission to the capture platform so OUR-server arena
      # matches become decryptable (POSTs each admitted peer's ChaCha20 key+nonce
      # to /api/arena/submit-key, reaching newblades-web by service name over the
      # shared edge_net). ARENA_SUBMIT_KEYS=0 disables it; ARENA_SUBMIT_TOKEN is a
      # frida_submit_tokens bearer (REQUIRED for submission to actually happen —
      # mint one for a designated user; empty = submission silently off).
      ARENA_SUBMIT_KEYS: ${ARENA_SUBMIT_KEYS:-1}
      ARENA_SUBMIT_TOKEN: ${ARENA_SUBMIT_TOKEN:-}
      ARENA_SUBMIT_URL: ${ARENA_SUBMIT_URL:-http://newblades-web:3000/api/arena/submit-key}
      ARENA_SUBMIT_GAMELIFT_IP: ${ARENA_SUBMIT_GAMELIFT_IP:-10.99.0.1}
      ARENA_SUBMIT_GAMELIFT_PORT: ${ARENA_SUBMIT_GAMELIFT_PORT:-7777}
      # DEBUG/experimental freeze: when truthy (1), a connected match sends the full
      # round-start burst then HOLDS at BackendMatchCreated forever — it never enters
      # the live combat round, no bot swings, and a solo (under-capacity) peer is NOT
      # swept/timed-out. Gives an unlimited window to hand-inject s2c frames via
      # /arena/debug/inject and watch the client. Empty/unset = normal matches.
      # Recreate the container to apply (no rebuild needed). See engine.rs / resolve.rs.
      ARENA_DEBUG_HOLD: ${ARENA_DEBUG_HOLD:-}
      # DEBUG ghost opponent: set to an arena `characters.user_id` UUID to give the
      # SOLO-FALLBACK match (one lone human → vs bot) that character's real loadout in
      # the 2nd fighter, so the engine broadcasts the opponent's op54 PROFILE
      # (GameMessageId 35). That profile flips the client's ClientChecklist
      # OpponentLoadoutReady → crosses "Connecting…" → "Setting up…". Empty/unset = a
      # normal empty-starter bot (no opponent profile). Does NOT affect a real PvP pair.
      # Recreate the container to apply (no rebuild needed). See matchmaker.rs / config.rs.
      ARENA_DEBUG_GHOST: ${ARENA_DEBUG_GHOST:-}
      RUST_LOG: ${RUST_LOG:-info}
    command:
      - run
      - --connection-string
      - postgres://blades:${ARENA_DB_PASSWORD}@arena-db:5432/blades
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --static-data
      - /data/static
    volumes:
      - ./deploy/static:/data/static:ro
    ports:
      # HTTP REST — bound to localhost; the newblades-web container reaches it
      # over edge_net by service name (http://arena-server:8080), not this port.
      - "127.0.0.1:8087:8080"
      # Arena UDP/ENet — clients dial this. Firewall it to just you for now
      # (security-group / iptables), since the handshake is not yet authenticated.
      - "${ARENA_UDP_PORT:-7777}:7777/udp"
    mem_limit: 256m
    networks: [arena_net, edge_net]

volumes:
  arena-db-data:

networks:
  arena_net:
  # Shared with newblades-web so it can POST imports to http://arena-server:8080.
  edge_net:
    external: true

# Newblades arena game server + its Postgres, sized for a SMALL, shared box:
# both are strictly memory-capped (mem_limit) so they are cgroup-isolated and
# CANNOT starve a co-located prod stack (e.g. twitter-bookmarks). 2 GB swap on
# the host is the backstop. NOT auto-deployed — see deploy/README-arena-deploy.md.
#
# Build the image OFF the 1.9 GB box (it OOMs a release build); this box only runs it.
services:
  arena-db:
    image: postgres:16-alpine
    container_name: arena-db
    restart: always
    environment:
      POSTGRES_USER: blades
      POSTGRES_PASSWORD: ${ARENA_DB_PASSWORD:?set ARENA_DB_PASSWORD in arena.env}
      POSTGRES_DB: blades
    # Tuned tiny so it fits the 256m cap on a constrained box.
    command: >
      postgres
      -c shared_buffers=32MB
      -c max_connections=20
      -c effective_cache_size=96MB
      -c work_mem=2MB
      -c maintenance_work_mem=16MB
      -c max_wal_size=256MB
    volumes:
      - arena-db-data:/var/lib/postgresql/data
    mem_limit: 256m
    # M1 (security review 2026-11-24). No cap_drop here: the postgres entrypoint
    # starts as root and needs CHOWN/FOWNER/DAC_OVERRIDE/SETUID/SETGID to fix the
    # data dir and drop to the postgres user, and pinning that cap list buys
    # little. no-new-privileges still applies (su-exec calls setuid(), it does
    # not rely on a setuid binary).
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    # Same reasoning as arena-server: a connection or schema error raised during a
    # deploy is precisely the log a recreate would erase.
    logging:
      driver: ${ARENA_LOG_DRIVER:-journald}
      options:
        tag: arena-db
    networks: [arena_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blades -d blades"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: apply the diesel migrations' up.sql on a FRESH db (idempotent — it
  # skips if the `users` table already exists), so the server finds its tables.
  arena-migrate:
    image: postgres:16-alpine
    depends_on:
      arena-db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${ARENA_DB_PASSWORD:?set ARENA_DB_PASSWORD in arena.env}
      # The password arena-server's own login role (arena_runtime) gets. Set
      # here, on every deploy, by the ROLES step at the end of the entrypoint.
      ARENA_RUNTIME_DB_PASSWORD: ${ARENA_RUNTIME_DB_PASSWORD:?set ARENA_RUNTIME_DB_PASSWORD in arena.env}
    volumes:
      - ./migrations:/migrations:ro
    networks: [arena_net]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 50
    # A real ledger, replacing "skip everything if the users table exists".
    #
    # The old rule meant this container did nothing on every deployment after
    # the first — while still exiting 0, which arena-server treats via
    # `service_completed_successfully` as "the schema is ready". So a new binary
    # could start against a schema that lacked its columns, and the only thing
    # standing between us and that was remembering to hand-apply ALTERs on the
    # box. The newest migration's own header says exactly that:
    #
    #     NOTE FOR DEPLOY: the migrate one-shot skips everything once 'users'
    #     exists, so this must be applied BY HAND on the box before the new
    #     binary ships.
    #
    # A deploy step that lives in a comment is not a deploy step. Now: apply
    # what has not been applied, record it, and FAIL if anything errors so the
    # dependency gate actually gates.
    entrypoint:
      - sh
      - -c
      - |
        set -e
        PSQL="psql -h arena-db -U blades -d blades -v ON_ERROR_STOP=1 -tA"

        # ROLES (H2, security review 2026-11-24). arena-server used to log in as
        # `blades`, the cluster SUPERUSER: one SQL injection or a compromised
        # process meant `COPY ... PROGRAM` (a shell in arena-db), reading files,
        # and every database on the cluster. It now logs in as arena_runtime:
        #
        #   arena_owner    NOLOGIN. Owns every object in public.
        #   arena_runtime  LOGIN, no superuser/createdb/createrole/replication/
        #                  bypassrls. Member of arena_owner and runs AS it
        #                  (ALTER ROLE ... SET role), so the startup DDL the
        #                  server does (CREATE TABLE IF NOT EXISTS, CREATE INDEX
        #                  on its own tables, CREATE OR REPLACE FUNCTION) keeps
        #                  working, and what it creates is owned by arena_owner.
        #
        # `blades` stays the superuser for this migrator and for backups
        # (pg_dump over the local socket). Converged on EVERY deploy, so a rebuilt
        # box or a restored dump ends up the same; objects created by hand as
        # `blades` are handed to arena_owner here too. The password comes in
        # through the environment (\getenv), never argv.
        converge_roles() {
        psql -h arena-db -U blades -d blades -v ON_ERROR_STOP=1 -q <<'SQL'
        \getenv runtime_pw ARENA_RUNTIME_DB_PASSWORD
        SET lock_timeout = '10s';
        DO $$roles$$
        BEGIN
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'arena_owner') THEN
            CREATE ROLE arena_owner NOLOGIN;
          END IF;
          IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'arena_runtime') THEN
            CREATE ROLE arena_runtime LOGIN;
          END IF;
        END
        $$roles$$;
        ALTER ROLE arena_owner NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
        ALTER ROLE arena_runtime LOGIN INHERIT NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS;
        ALTER ROLE arena_runtime PASSWORD :'runtime_pw';
        GRANT arena_owner TO arena_runtime;
        ALTER ROLE arena_runtime SET role = 'arena_owner';
        GRANT CONNECT, TEMPORARY ON DATABASE blades TO arena_owner;
        GRANT USAGE, CREATE ON SCHEMA public TO arena_owner;
        DO $$own$$
        DECLARE r record;
        BEGIN
          FOR r IN SELECT c.oid::regclass AS obj, c.relkind FROM pg_class c
                   JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE n.nspname = 'public' AND c.relowner = 'blades'::regrole
                     AND c.relkind IN ('r', 'p', 'v', 'm', 'f') LOOP
            EXECUTE format('ALTER %s %s OWNER TO arena_owner',
              CASE r.relkind WHEN 'v' THEN 'VIEW' WHEN 'm' THEN 'MATERIALIZED VIEW'
                             WHEN 'f' THEN 'FOREIGN TABLE' ELSE 'TABLE' END, r.obj);
          END LOOP;
          -- Sequences a column owns moved with their table above.
          FOR r IN SELECT c.oid::regclass AS obj FROM pg_class c
                   JOIN pg_namespace n ON n.oid = c.relnamespace
                   WHERE n.nspname = 'public' AND c.relowner = 'blades'::regrole AND c.relkind = 'S'
                     AND NOT EXISTS (SELECT 1 FROM pg_depend d
                                     WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                                       AND d.refclassid = 'pg_class'::regclass AND d.deptype IN ('a', 'i')) LOOP
            EXECUTE format('ALTER SEQUENCE %s OWNER TO arena_owner', r.obj);
          END LOOP;
          FOR r IN SELECT p.oid::regprocedure AS fn, p.prokind FROM pg_proc p
                   JOIN pg_namespace n ON n.oid = p.pronamespace
                   WHERE n.nspname = 'public' AND p.proowner = 'blades'::regrole LOOP
            EXECUTE format('ALTER %s %s OWNER TO arena_owner',
              CASE r.prokind WHEN 'p' THEN 'PROCEDURE' WHEN 'a' THEN 'AGGREGATE' ELSE 'FUNCTION' END, r.fn);
          END LOOP;
        END
        $$own$$;
        ALTER DEFAULT PRIVILEGES FOR ROLE blades IN SCHEMA public GRANT ALL ON TABLES TO arena_owner;
        ALTER DEFAULT PRIVILEGES FOR ROLE blades IN SCHEMA public GRANT ALL ON SEQUENCES TO arena_owner;
        SQL
        echo "[arena-migrate] roles converged (arena-server logs in as arena_runtime)"
        }
        $$PSQL -c "CREATE TABLE IF NOT EXISTS schema_migrations (
                     version    text PRIMARY KEY,
                     applied_at timestamptz NOT NULL DEFAULT now())"

        # ADOPTION. The live database predates this ledger and already has all
        # 16 migrations applied by hand, so an empty ledger must NOT be read as
        # "apply everything" — that would re-run 16 non-idempotent scripts
        # against production. Empty ledger + existing users table means an
        # established database: record the current migrations as applied and
        # change nothing. A genuinely fresh database has no users table and
        # falls through to the normal path below.
        if [ "$$($$PSQL -c 'SELECT count(*) FROM schema_migrations')" = "0" ] \
           && [ -n "$$($$PSQL -c "SELECT to_regclass('public.users')")" ]; then
          echo "[arena-migrate] established schema, empty ledger -> adopting, applying nothing"
          for d in $$(ls -d /migrations/*/ | sort); do
            v=$$(basename "$$d")
            $$PSQL -c "INSERT INTO schema_migrations(version) VALUES ('$$v') ON CONFLICT DO NOTHING"
            echo "  adopted $$v"
          done
          converge_roles
          exit 0
        fi

        n=0
        for d in $$(ls -d /migrations/*/ | sort); do
          v=$$(basename "$$d")
          [ -f "$$d/up.sql" ] || continue
          if [ -n "$$($$PSQL -c "SELECT 1 FROM schema_migrations WHERE version = '$$v'")" ]; then
            continue
          fi
          echo "[arena-migrate] applying $$v"
          psql -h arena-db -U blades -d blades -v ON_ERROR_STOP=1 -f "$$d/up.sql"
          $$PSQL -c "INSERT INTO schema_migrations(version) VALUES ('$$v')"
          n=$$((n + 1))
        done
        echo "[arena-migrate] done ($$n newly applied)"

        converge_roles
    restart: "no"

  arena-server:
    # Published by .github/workflows/release.yml on merge to main. Production
    # PULLS this; it does not build. The box is 2 vCPU / 1.9 GB and the release
    # build OOMs there, and a forgotten --no-cache silently ships a stale binary
    # — both problems disappear when the artifact is built once, elsewhere, from
    # a clean checkout.
    #
    # ARENA_IMAGE_TAG exists for rollback: set it to a previous sha-<short> tag
    # and `up -d` to go back. Defaults to the tag the box tracks.
    image: ghcr.io/b3rntsen/blades-arena-server:${ARENA_IMAGE_TAG:-main}
    # Kept for local development only — `docker compose build arena-server`.
    # Production never reaches it: the deploy helper runs `up -d --no-build`.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena-server
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
    depends_on:
      arena-migrate:
        condition: service_completed_successfully
    environment:
      ARENA_IMPORT_TOKEN: ${ARENA_IMPORT_TOKEN:?set ARENA_IMPORT_TOKEN in arena.env}
      ARENA_ADVERTISE_HOST: ${ARENA_ADVERTISE_HOST:-127.0.0.1}
      # The address handed to clients that did NOT arrive through the tunnel.
      # Empty/unset means "no public path" and everyone gets ARENA_ADVERTISE_HOST,
      # which is the pre-VPN-free behaviour.
      #
      # It has to be listed HERE or it never reaches the process: compose passes
      # only what this block names, so setting it in arena.env alone leaves the
      # server seeing nothing and every public client is told to dial 10.99.0.1
      # — an RFC1918 address they cannot route to, with no error anywhere.
      ARENA_ADVERTISE_HOST_PUBLIC: ${ARENA_ADVERTISE_HOST_PUBLIC:-}
      ARENA_UDP_PORT: ${ARENA_UDP_PORT:-7777}
      ARENA_MAX_MATCHES: ${ARENA_MAX_MATCHES:-16}
      # Seconds a lone matchmaking ticket waits for a human opponent before falling
      # back to a solo match vs a bot. Tunable without a rebuild (recreate to apply).
      ARENA_SOLO_FALLBACK_SECS: ${ARENA_SOLO_FALLBACK_SECS:-20}
      # The other two fallback tiers (see matchmaker.rs). `busy` applies while
      # somebody else is mid-match; `recent` covers a player BETWEEN fights, who is
      # neither queued nor live and whom the other two tiers used to miss entirely.
      ARENA_BUSY_FALLBACK_SECS: ${ARENA_BUSY_FALLBACK_SECS:-230}
      ARENA_RECENT_FALLBACK_SECS: ${ARENA_RECENT_FALLBACK_SECS:-30}
      ARENA_RECENT_WINDOW_SECS: ${ARENA_RECENT_WINDOW_SECS:-300}
      # Humans-first matchmaking (fork #610). Defaults = the code's own; set in arena.env to tune.
      ARENA_HUMANS_FIRST_COOLDOWN_SECS: ${ARENA_HUMANS_FIRST_COOLDOWN_SECS:-60}
      ARENA_HUMANS_FIRST_MAX_WAIT_SECS: ${ARENA_HUMANS_FIRST_MAX_WAIT_SECS:-300}
      ARENA_HUMANS_FIRST_ACTIVE_COOLDOWN_SECS: ${ARENA_HUMANS_FIRST_ACTIVE_COOLDOWN_SECS:-180}
      ARENA_HUMANS_FIRST_ACTIVE_MAX_WAIT_SECS: ${ARENA_HUMANS_FIRST_ACTIVE_MAX_WAIT_SECS:-600}
      ARENA_ACTIVE_MIN_H2H: ${ARENA_ACTIVE_MIN_H2H:-10}
      ARENA_ACTIVE_WINDOW_DAYS: ${ARENA_ACTIVE_WINDOW_DAYS:-28}
      ARENA_BOT_USER_IDS: ${ARENA_BOT_USER_IDS:-}
      # WireGuard peers allowed to vouch for a client's device IP via the
      # X-Newblades-Device-Ip header (d129/d133). Empty = trust nobody. It was
      # hand-added to the box's root compose only; carried here so installing
      # this file does not silently drop it.
      ARENA_DEVICE_IP_TRUSTED_PEERS: ${ARENA_DEVICE_IP_TRUSTED_PEERS:-}
      # Dev override: pin EVERY anon login to this user (a Transfer'd character),
      # since there's no Bethesda/Google identity. Empty/unset = normal behaviour.
      ARENA_DEV_LOGIN_USER_ID: ${ARENA_DEV_LOGIN_USER_ID:-}
      # Player level cap (#425). Unset/100 = retail. Raise (max 150) ONLY after the
      # client data pack that extends the client's level table is in production:
      # a client without it hangs on load once a character passes 100.
      ARENA_MAX_PLAYER_LEVEL: ${ARENA_MAX_PLAYER_LEVEL:-100}
      # Per-match key submission to the capture platform so OUR-server arena
      # matches become decryptable (POSTs each admitted peer's ChaCha20 key+nonce
      # to /api/arena/submit-key, reaching newblades-web by service name over the
      # shared nb_edge). ARENA_SUBMIT_KEYS=0 disables it; ARENA_SUBMIT_TOKEN is a
      # frida_submit_tokens bearer (REQUIRED for submission to actually happen —
      # mint one for a designated user; empty = submission silently off).
      ARENA_SUBMIT_KEYS: ${ARENA_SUBMIT_KEYS:-1}
      ARENA_SUBMIT_TOKEN: ${ARENA_SUBMIT_TOKEN:-}
      ARENA_SUBMIT_URL: ${ARENA_SUBMIT_URL:-http://newblades-web:3000/api/arena/submit-key}
      ARENA_SUBMIT_GAMELIFT_IP: ${ARENA_SUBMIT_GAMELIFT_IP:-10.99.0.1}
      ARENA_SUBMIT_GAMELIFT_PORT: ${ARENA_SUBMIT_GAMELIFT_PORT:-7777}
      # DEBUG/experimental freeze: both the truthy switch AND a Unix deadline no
      # more than 30 minutes ahead are required. During that bounded window a
      # connected match parks at BackendMatchCreated for hand-injection; at expiry
      # existing matches resume and cleanup is restored. A stale switch by itself is
      # ignored, so a later container recreation cannot freeze the whole arena.
      ARENA_DEBUG_HOLD: ${ARENA_DEBUG_HOLD:-}
      ARENA_DEBUG_HOLD_UNTIL_UNIX: ${ARENA_DEBUG_HOLD_UNTIL_UNIX:-}
      # DEBUG ghost opponent: set to an arena `characters.user_id` UUID to give the
      # SOLO-FALLBACK match (one lone human → vs bot) that character's real loadout in
      # the 2nd fighter, so the engine broadcasts the opponent's op54 PROFILE
      # (GameMessageId 35). That profile flips the client's ClientChecklist
      # OpponentLoadoutReady → crosses "Connecting…" → "Setting up…". Empty/unset = a
      # normal empty-starter bot (no opponent profile). Does NOT affect a real PvP pair.
      # Recreate the container to apply (no rebuild needed). See matchmaker.rs / config.rs.
      ARENA_DEBUG_GHOST: ${ARENA_DEBUG_GHOST:-}
      # Rehearsal of the December 2026 Sigil-per-fight (tracker #499): "1" pays
      # marked TEST characters the fight Sigil outside the December window, so the
      # result card can be checked on a device beforehand. Empty/unset = off, and
      # nobody else is ever affected. Recreate to apply; unset it afterwards.
      ARENA_FIGHT_SIGIL_REHEARSAL: ${ARENA_FIGHT_SIGIL_REHEARSAL:-}
      # Match-end card switches (#401, #319). Empty/unset = off. Each puts items in
      # the op49 result card's backpack change set, which retail never did; both were
      # checked on a real client against a local server on 2026-10-23 (card renders,
      # lobby returns, items in inventory, clean relaunch). Recreate to apply.
      ARENA_WEAPON_ON_RESULT_CARD: ${ARENA_WEAPON_ON_RESULT_CARD:-}
      ARENA_PROMOTION_ITEMS_ON_CARD: ${ARENA_PROMOTION_ITEMS_ON_CARD:-}
      RUST_LOG: ${RUST_LOG:-info}
      # The DB password reaches the server through the ENVIRONMENT, never as a
      # command-line argument: argv lands in /proc/<pid>/cmdline, which any
      # unprivileged local account can read via `ps aux`. This box also hosts
      # other services, so that was a real exposure rather than a theoretical
      # one.
      #
      # arena_runtime, not the `blades` superuser (H2): see the ROLES step in
      # arena-migrate, which creates the role and sets this password.
      ARENA_DATABASE_URL: postgres://arena_runtime:${ARENA_RUNTIME_DB_PASSWORD:?set ARENA_RUNTIME_DB_PASSWORD in arena.env}@arena-db:5432/blades
      # Per-player arena combat tracing (reports #152/#163/#164: desync and the
      # end-of-match freeze). Writes one file per session under this directory.
      # Bounded in the binary -- 32 MiB per session, 512 MiB total -- so it cannot
      # fill the disk, and it is inert when unset.
      #
      # It has to be named HERE or it never reaches the process: compose passes
      # only what this block lists, so setting it in arena.env alone does nothing
      # (the same trap ARENA_ADVERTISE_HOST_PUBLIC documents above).
      ARENA_TRACE_DIR: ${ARENA_TRACE_DIR:-/data/arena-traces}
      ARENA_TRACE_MAX_SESSION_BYTES: ${ARENA_TRACE_MAX_SESSION_BYTES:-33554432}
      ARENA_TRACE_MAX_TOTAL_BYTES: ${ARENA_TRACE_MAX_TOTAL_BYTES:-536870912}
    command:
      - run
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --static-data
      - /data/static
    volumes:
      - ./deploy/static:/data/static:ro
      # Traces must OUTLIVE THE CONTAINER for the same reason the logs do: a
      # deploy recreates it. The host path stays under /var/lib/newblades, which
      # is what setup-deploy-user.sh validates.
      - /var/lib/newblades/arena-traces:/data/arena-traces
    ports:
      # HTTP REST — bound to localhost; the newblades-web container reaches it
      # over nb_edge by service name (http://arena-server:8080), not this port.
      - "127.0.0.1:8087:8080"
      # Arena UDP/ENet — clients dial this. Firewall it to just you for now
      # (security-group / iptables), since the handshake is not yet authenticated.
      - "${ARENA_UDP_PORT:-7777}:7777/udp"
    # 512m, not 256m. At 256m the server's steady baseline (static game-data
    # tables held parsed in memory) reached ~251 MiB and the cgroup OOM killer
    # took it 7 times on 2026-09-25, silently dropping every connected player.
    # The box has ~1.7 GB available. Applied live to the root-owned
    # /etc/newblades/docker-compose.arena.yml the same day; this keeps the repo
    # copy, which re-installs it, from reverting that.
    mem_limit: 512m
    # Logs must OUTLIVE THE CONTAINER.
    #
    # The default json-file driver stores logs in the container's own directory,
    # so `docker compose up -d` — which RECREATES rather than restarts — destroys
    # them. That is not theoretical: the first human-vs-human arena session was
    # investigated a day later and every combat log line from it was already gone,
    # wiped by the deploy that followed. Only the Postgres rows survived, and they
    # do not record what the engine decided.
    #
    # journald keeps them in the host journal instead, which on this box is
    # persistent (/var/log/journal) and rotates itself. Read them with:
    #
    #     journalctl CONTAINER_NAME=arena-server --since '2026-08-25 20:00'
    #     journalctl CONTAINER_NAME=arena-server -f          # follow
    #
    # Override with ARENA_LOG_DRIVER=json-file for a box without persistent
    # journald (the logs then die with the container again).
    logging:
      driver: ${ARENA_LOG_DRIVER:-journald}
      options:
        tag: arena-server
    networks: [arena_net, nb_edge]
    # M1 (security review 2026-11-24). The image runs as uid 10001; both ports
    # are above 1024, so it needs no capabilities at all. Root filesystem
    # read-only: the server writes only ARENA_TRACE_DIR (a bind mount the host
    # chowns to 10001) and /tmp, a small tmpfs.
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    pids_limit: 512

volumes:
  arena-db-data:

networks:
  arena_net:
  # Newblades' side of the edge (H5, security review 2026-11-24): edge-nginx and
  # newblades-web reach http://arena-server:8080 here. It replaces `edge_net`,
  # which twitter's nginx is also on. Created by the web repo's
  # edge/docker-compose.yml (172.30.0.0/24); it must exist before this file is
  # used.
  nb_edge:
    external: true
    name: nb_edge
